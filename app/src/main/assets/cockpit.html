<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:white;font-family:Arial;overflow:hidden}
main{height:100vh;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:2vw;padding:2vw}
.side{display:flex;flex-direction:column;gap:12px}
.logo{text-align:center;font-weight:bold;font-size:23px;letter-spacing:3px}
.logo span{color:#ed243b}
button{background:#191c23;color:white;border:1px solid #792332;border-radius:12px;padding:15px 5px;font-weight:bold;font-size:14px}
button small{display:block;color:#aaa;margin-top:6px}
.center{text-align:center}
.gauge{position:relative;width:min(43vw,72vh);height:min(43vw,72vh);margin:auto;border:7px solid #34363d;border-radius:50%;box-shadow:0 0 25px #8e1028,inset 0 0 35px #000;background:radial-gradient(circle,#1b1e25,#08090d)}
.needle{position:absolute;left:calc(50% - 2px);bottom:50%;width:4px;height:38%;background:#ff2947;transform-origin:bottom;transform:rotate(-130deg);transition:transform .6s}
.hub{position:absolute;left:calc(50% - 9px);top:calc(50% - 9px);width:18px;height:18px;border-radius:50%;background:#ff2947}
.speed{position:absolute;top:51%;width:100%;font-size:clamp(35px,6vw,75px);font-weight:bold}
.unit{position:absolute;top:76%;width:100%;color:#aaa;font-size:12px}
.gps{position:absolute;top:25%;width:100%;font-size:11px;color:#aaa}
#date{margin-top:12px;color:#999;font-size:12px}
</style>
</head>
<body>
<main>
<div class="side">
<div class="logo">DRIVE <span>ONE</span></div>
<button onclick="send('engine')">SPORT SOUND<small id="engine">ON</small></button>
<button onclick="send('engine_test')">TEST MOTEUR</button>
<button onclick="send('gps')">GPS<small id="gpsSide">EN ATTENTE</small></button>
</div>
<div class="center">
<div class="gauge">
<div class="gps" id="gps">GPS EN ATTENTE</div>
<div class="needle" id="needle"></div>
<div class="hub"></div>
<div class="speed" id="speed">0</div>
<div class="unit">KM/H</div>
</div>
<div id="date">DRIVE ONE</div>
</div>
<div class="side">
<div class="logo" id="clock">--:--</div>
<button onclick="send('info')">INFOS AUTO</button>
<button onclick="send('settings')">PARAMÈTRES</button>
<button onclick="send('wifi')">CONNEXION<small id="wifi">À CONFIGURER</small></button>
<div style="text-align:center">BATTERIE <span id="battery">--%</span></div>
</div>
</main>
<script>
function send(a){
if(window.Native&&Native.action)Native.action(a);
}
window.driveUpdate=function(d){
if(!d)return;
let s=Math.max(0,Math.min(240,Number(d.speed)||0));
document.getElementById('speed').textContent=Math.round(s);
document.getElementById('needle').style.transform='rotate('+(-130+s/240*260)+'deg)';
document.getElementById('gps').textContent='GPS '+(d.gps||'EN ATTENTE');
document.getElementById('gpsSide').textContent=d.gps||'EN ATTENTE';
document.getElementById('engine').textContent=d.engine||'OFF';
document.getElementById('clock').textContent=d.clock||'--:--';
document.getElementById('date').textContent=d.date||'DRIVE ONE';
document.getElementById('wifi').textContent=d.wifi||'À CONFIGURER';
document.getElementById('battery').textContent=d.battery||'--%';
};
</script>
</body>
</html>
